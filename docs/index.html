<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CLAIM·AS 비용 대시보드</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{
  --bg:#f4f6f9;--card:#fff;--ink:#1c2430;--mute:#6b7685;--line:#e3e8ee;
  --as:#2f6fdb;--claim:#e8590c;--etc:#9aa5b4;--ok:#1f9d55;--bad:#d64545;--prior:#8d99ab;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#10151c;--card:#1a212b;--ink:#e8edf3;--mute:#93a0b1;--line:#2a3340;
    --as:#5b9bff;--claim:#ff8a4c;--etc:#6b7685;--ok:#3ecf7a;--bad:#ff6b6b;--prior:#7d8ba0}
}
:root[data-theme="dark"]{--bg:#10151c;--card:#1a212b;--ink:#e8edf3;--mute:#93a0b1;--line:#2a3340;
  --as:#5b9bff;--claim:#ff8a4c;--etc:#6b7685;--ok:#3ecf7a;--bad:#ff6b6b;--prior:#7d8ba0}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 "Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif}
.wrap{max-width:1280px;margin:0 auto;padding:16px}
header{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:baseline;justify-content:space-between;margin-bottom:12px}
h1{font-size:20px;margin:0}
.meta{color:var(--mute);font-size:12px}
.filters{display:flex;flex-wrap:wrap;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:12px}
.filters label{display:flex;flex-direction:column;font-size:11px;color:var(--mute);gap:2px}
.filters select{font:inherit;font-size:13px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:5px 8px;min-width:100px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;margin-bottom:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.kpi .t{font-size:12px;color:var(--mute)}
.kpi .v{font-size:24px;font-weight:700;margin:2px 0}
.kpi .s{font-size:12px;color:var(--mute)}
.up{color:var(--bad)}.down{color:var(--ok)}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:6px}
.bar>i{display:block;height:100%;background:var(--as)}
.bar>i.over{background:var(--bad)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.card h2{font-size:14px;margin:0 0 8px}
.card .box{position:relative;height:280px}
.wide{grid-column:1/-1}
.note{font-size:11px;color:var(--mute);margin-top:12px}
.warn{background:#fff6e5;color:#7a4b00;border:1px solid #f1d49a;border-radius:8px;padding:6px 10px;margin-bottom:12px;font-size:12px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .warn{background:#3a2e14;color:#f1d49a;border-color:#5b4820}}
@media(max-width:800px){.grid{grid-template-columns:1fr}.kpi .v{font-size:20px}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>CLAIM·AS 비용 대시보드</h1>
    <div class="meta" id="meta"></div>
  </header>

  <div class="filters">
    <label>연도<select id="fYear"></select></label>
    <label>유/무상<select id="fPaid"></select></label>
    <label>구분<select id="fKind"></select></label>
    <label>고객<select id="fCust"></select></label>
    <label>선종<select id="fType"></select></label>
  </div>

  <div class="warn" id="warn" hidden></div>
  <div class="kpis" id="kpis"></div>

  <div class="grid">
    <div class="card wide"><h2>연도별 비용 (A/S · CLAIM)</h2><div class="box"><canvas id="cYear"></canvas></div></div>
    <div class="card"><h2 id="tMonth">월별 비용</h2><div class="box"><canvas id="cMonth"></canvas></div></div>
    <div class="card"><h2 id="tCum">누적 추이 / 목표</h2><div class="box"><canvas id="cCum"></canvas></div></div>
    <div class="card"><h2>불량명칭별</h2><div class="box"><canvas id="cDefect"></canvas></div></div>
    <div class="card"><h2>장비별 상위 12</h2><div class="box"><canvas id="cEquip"></canvas></div></div>
    <div class="card"><h2>거래처별 상위 10</h2><div class="box"><canvas id="cVendor"></canvas></div></div>
    <div class="card"><h2>호선별 상위 10</h2><div class="box"><canvas id="cShip"></canvas></div></div>
  </div>
  <div class="note" id="note"></div>
</div>

<script>
const $ = id => document.getElementById(id);
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const KIND_COLOR = () => ({ 'A/S': css('--as'), 'CLAIM': css('--claim'), '미분류': css('--etc') });
const KINDS = ['A/S', 'CLAIM', '미분류'];
let ROWS = [], REC = [], DATA, SET, charts = {};
let latestY, latestM;

const fmt = v => {
  const a = Math.abs(v);
  if (a >= 1e8) return (v / 1e8).toFixed(2) + '억';
  if (a >= 1e4) return Math.round(v / 1e4).toLocaleString() + '만';
  return Math.round(v).toLocaleString();
};
const pct = (v, d = 1) => (v * 100).toFixed(d) + '%';
const sum = (a, f) => a.reduce((s, r) => s + f(r), 0);

async function init() {
  const [d, s] = await Promise.all([
    fetch('data.json', { cache: 'no-cache' }).then(r => r.json()),
    fetch('settings.json', { cache: 'no-cache' }).then(r => r.json()).catch(() => ({}))
  ]);
  DATA = d; SET = s;
  ROWS = d.rows.map(r => { const o = {}; d.dims.forEach((k, i) => o[k] = r[i]); o.v = r[d.dims.length]; o.n = r[d.dims.length + 1]; return o; });
  REC = d.receipts.map(r => ({ y: r[0], m: r[1], k: r[2], p: r[3], n: r[4] }));
  const [ly, lm] = d.latest.split('-').map(Number); latestY = ly; latestM = lm;

  const years = [...new Set(ROWS.map(r => r.연))].sort((a, b) => b - a);
  fill('fYear', years.map(y => [y, y + '년']), latestY);
  fill('fPaid', [['무상', '무상'], ['유상', '유상'], ['', '전체']], '무상');
  fill('fKind', [['', '전체'], ['A/S', 'A/S'], ['CLAIM', 'CLAIM'], ['미분류', '미분류']], '');
  fill('fCust', [['', '전체'], ...[...new Set(ROWS.map(r => r.고객))].filter(Boolean).sort().map(c => [c, c])], '');
  fill('fType', [['', '전체'], ['상선', '상선'], ['특수선', '특수선'], ['기타', '기타']], '');
  ['fYear', 'fPaid', 'fKind', 'fCust', 'fType'].forEach(i => $(i).addEventListener('change', render));
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', render);

  $('meta').textContent = `데이터 기준일 ${d.latest} · 갱신 ${d.generated}`;
  if (d.unmatched && d.unmatched.rows) {
    $('warn').hidden = false;
    $('warn').textContent = `A/S번호로 접수 목록을 찾지 못해 '미분류'로 처리된 항목: ${d.unmatched.rows.toLocaleString()}건 (${fmt(d.unmatched.amount)}원)`;
  }
  render();
}
function fill(id, opts, sel) {
  $(id).innerHTML = opts.map(([v, t]) => `<option value="${v}">${t}</option>`).join('');
  $(id).value = sel;
}

function baseFilter() {   // 연도를 제외한 필터
  const paid = $('fPaid').value, kind = $('fKind').value, cust = $('fCust').value, type = $('fType').value;
  return r => (!paid || r.유무상 === paid) && (!kind || r.구분 === kind) && (!cust || r.고객 === cust) && (!type || r.선종 === type);
}
function group(rows, keyFn, valFn = r => r.v) {
  const m = new Map();
  rows.forEach(r => { const k = keyFn(r); m.set(k, (m.get(k) || 0) + valFn(r)); });
  return m;
}
function avg3Revenue(y) {
  const rev = SET.revenue || {};
  const vals = [y - 2, y - 1, y].map(k => rev[k]).filter(v => v != null);
  return vals.length ? vals.reduce((a, b) => a + b, 0) / vals.length : null;
}

function render() {
  const Y = +$('fYear').value, f = baseFilter();
  const base = ROWS.filter(f);
  const cutM = Y === latestY ? latestM : 12;           // 진행 중 연도는 최신 월까지 비교
  const cur = base.filter(r => r.연 === Y && r.월 <= cutM);
  const prv = base.filter(r => r.연 === Y - 1 && r.월 <= cutM);
  const curAll = base.filter(r => r.연 === Y);

  renderKpis(Y, cur, prv, curAll, cutM);
  renderYear(base);
  renderMonth(Y, base, cutM);
  renderCum(Y, base, cutM);
  renderRank('cDefect', cur, r => r.불량명칭, 12);
  renderRank('cEquip', cur, r => r.장비 || '(없음)', 12);
  renderRank('cVendor', cur, r => r.거래처명 || '(없음)', 10);
  renderRank('cShip', cur, r => r.호선 || '(없음)', 10);
  $('note').textContent = `* ${Y}년 ${cutM === 12 ? '전체' : '1~' + cutM + '월'} 기준. 접수 건수는 고객·선종 필터와 무관. ` +
    `매출 대비 비율은 ${SET.ratio_basis === 'year' ? '해당 연도 매출' : '최근 3개년 평균 매출'} 기준 (설정: settings.json).`;
}

function kpiHtml(t, v, s, extra = '') {
  return `<div class="card kpi"><div class="t">${t}</div><div class="v">${v}</div><div class="s">${s}</div>${extra}</div>`;
}
function renderKpis(Y, cur, prv, curAll, cutM) {
  const c = sum(cur, r => r.v), p = sum(prv, r => r.v);
  const claim = sum(cur.filter(r => r.구분 === 'CLAIM'), r => r.v);
  const delta = p ? (c - p) / p : null;
  const tgt = (SET.kpi || {})[Y] || {};
  const out = [];

  out.push(kpiHtml(`${Y}년 총 비용`, fmt(c) + '원', `${cur.length ? sum(cur, r => r.n).toLocaleString() : 0}건 · 연 합계 ${fmt(sum(curAll, r => r.v))}`));
  out.push(kpiHtml('전년 동기 대비', delta == null ? '-' : `<span class="${delta > 0 ? 'up' : 'down'}">${delta > 0 ? '▲' : '▼'} ${pct(Math.abs(delta))}</span>`,
    `전년 ${fmt(p)}원`));

  if (tgt.cost_target) {
    const prog = c / tgt.cost_target;
    out.push(kpiHtml('연간 비용 목표', pct(prog, 0), `목표 ${fmt(tgt.cost_target)}원 · 잔여 ${fmt(tgt.cost_target - c)}`,
      `<div class="bar"><i class="${prog > 1 ? 'over' : ''}" style="width:${Math.min(prog, 1) * 100}%"></i></div>`));
  } else out.push(kpiHtml('연간 비용 목표', '미설정', 'settings.json 의 kpi.cost_target'));

  const rev = SET.ratio_basis === 'year' ? (SET.revenue || {})[Y] : avg3Revenue(Y);
  if (rev) {
    const ratio = c / rev;
    const rt = tgt.ratio_target;
    out.push(kpiHtml('매출 대비 비용', pct(ratio, 2), rt ? `목표 ${pct(rt, 2)} · ${ratio <= rt ? '달성' : '초과'}` : `매출 ${fmt(rev)}원`,
      rt ? `<div class="bar"><i class="${ratio > rt ? 'over' : ''}" style="width:${Math.min(ratio / rt, 1) * 100}%"></i></div>` : ''));
  } else out.push(kpiHtml('매출 대비 비용', '-', '매출액 미입력'));

  out.push(kpiHtml('CLAIM 비중', c ? pct(claim / c) : '-', `CLAIM ${fmt(claim)}원`));

  const paid = $('fPaid').value, kind = $('fKind').value;
  const rc = REC.filter(r => r.y === Y && r.m <= cutM && (!paid || r.p === paid) && (!kind || (kind !== '미분류' && r.k.includes(kind))));
  out.push(kpiHtml('접수 건수', sum(rc, r => r.n).toLocaleString() + '건', `A/S ${sum(rc.filter(r => r.k.includes('A/S')), r => r.n)} · CLAIM ${sum(rc.filter(r => r.k.includes('CLAIM')), r => r.n)}`));
  $('kpis').innerHTML = out.join('');
}

function mk(id, cfg) {
  if (charts[id]) charts[id].destroy();
  Chart.defaults.color = css('--mute'); Chart.defaults.borderColor = css('--line');
  Chart.defaults.font.family = '"Malgun Gothic",system-ui,sans-serif';
  charts[id] = new Chart($(id), cfg);
}
const tipMoney = { callbacks: { label: c => ` ${c.dataset.label}: ${Math.round(c.parsed.y ?? c.parsed.x).toLocaleString()}원` } };
const yAxis = { ticks: { callback: v => fmt(v) } };

function renderYear(base) {
  const years = [...new Set(base.map(r => r.연))].sort();
  const col = KIND_COLOR();
  mk('cYear', {
    type: 'bar',
    data: { labels: years.map(y => y + (y === latestY && latestM < 12 ? ` (~${latestM}월)` : '')),
      datasets: KINDS.map(k => ({ label: k, backgroundColor: col[k], stack: 's',
        data: years.map(y => sum(base.filter(r => r.연 === y && r.구분 === k), r => r.v)) })) },
    options: { responsive: true, maintainAspectRatio: false, scales: { x: { stacked: true }, y: { stacked: true, ...yAxis } },
      plugins: { tooltip: tipMoney } }
  });
}
function monthly(rows) { const a = Array(12).fill(0); rows.forEach(r => a[r.월 - 1] += r.v); return a; }
function renderMonth(Y, base, cutM) {
  $('tMonth').textContent = `${Y}년 월별 비용 vs ${Y - 1}년`;
  const col = KIND_COLOR(), cy = base.filter(r => r.연 === Y), py = monthly(base.filter(r => r.연 === Y - 1));
  mk('cMonth', {
    data: { labels: [...Array(12)].map((_, i) => (i + 1) + '월'),
      datasets: [
        ...['A/S', 'CLAIM', '미분류'].map(k => ({ type: 'bar', label: k, backgroundColor: col[k], stack: 's', data: monthly(cy.filter(r => r.구분 === k)).map((v, i) => i < cutM ? v : null) })),
        { type: 'line', label: `${Y - 1}년`, borderColor: css('--prior'), backgroundColor: css('--prior'), borderDash: [5, 4], pointRadius: 2, data: py }
      ] },
    options: { responsive: true, maintainAspectRatio: false, scales: { x: { stacked: true }, y: { stacked: true, ...yAxis } }, plugins: { tooltip: tipMoney } }
  });
}
function cumul(a) { let s = 0; return a.map(v => s += v); }
function renderCum(Y, base, cutM) {
  const tgt = ((SET.kpi || {})[Y] || {}).cost_target;
  $('tCum').textContent = `${Y}년 누적 비용` + (tgt ? ' / 연간 목표' : '');
  const cy = cumul(monthly(base.filter(r => r.연 === Y))).map((v, i) => i < cutM ? v : null);
  const py = cumul(monthly(base.filter(r => r.연 === Y - 1)));
  const ds = [
    { label: `${Y}년`, borderColor: css('--as'), backgroundColor: css('--as'), data: cy, pointRadius: 2, tension: .2 },
    { label: `${Y - 1}년`, borderColor: css('--prior'), backgroundColor: css('--prior'), borderDash: [5, 4], data: py, pointRadius: 0 }
  ];
  if (tgt) ds.push({ label: '목표(월 균등)', borderColor: css('--bad'), backgroundColor: css('--bad'), borderDash: [2, 3], pointRadius: 0, data: [...Array(12)].map((_, i) => tgt * (i + 1) / 12) });
  mk('cCum', { type: 'line', data: { labels: [...Array(12)].map((_, i) => (i + 1) + '월'), datasets: ds },
    options: { responsive: true, maintainAspectRatio: false, scales: { y: yAxis }, plugins: { tooltip: tipMoney } } });
}
function renderRank(id, rows, keyFn, n) {
  const tot = group(rows, keyFn);
  const keys = [...tot.entries()].sort((a, b) => b[1] - a[1]).slice(0, n).map(e => e[0]);
  const col = KIND_COLOR();
  mk(id, {
    type: 'bar',
    data: { labels: keys, datasets: KINDS.map(k => {
      const g = group(rows.filter(r => r.구분 === k), keyFn);
      return { label: k, backgroundColor: col[k], stack: 's', data: keys.map(x => g.get(x) || 0) };
    }) },
    options: { indexAxis: 'y', responsive: true, maintainAspectRatio: false,
      scales: { x: { stacked: true, ticks: { callback: v => fmt(v) } }, y: { stacked: true, ticks: { autoSkip: false } } },
      plugins: { tooltip: tipMoney } }
  });
}
init();
</script>
</body>
</html>
